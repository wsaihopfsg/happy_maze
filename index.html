<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Maze Escape Fixed</title>
    <style>
        /* General Resets */
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; height: 100%; width: 100%; }
        
        /* --- LANDSCAPE LOCK --- */
        #portrait-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            color: #ff9900;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Show warning only in portrait mode on mobile */
        @media screen and (orientation: portrait) and (max-width: 768px) {
            #portrait-warning { display: flex; }
            #game-container { visibility: hidden; }
        }

        /* --- GAME UI --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            touch-action: none; 
        }

        #top-bar {
            padding: 20px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 5px #0f0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
        }

        #look-hint {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px black;
        }

        /* --- OVERLAYS --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }

        button {
            padding: 20px 40px;
            font-size: 24px;
            background: #0f0;
            border: none;
            color: #000;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 0 10px #0f0;
        }
        button:active { background: #0a0; }

        /* --- CONTROLS --- */
        #touch-surface {
             position: absolute;
             top:0; left:0; width:100%; height:100%;
             pointer-events: auto;
             touch-action: none; 
             z-index: 1;
        }

        #joystick-zone-wrapper {
            pointer-events: none;
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 20; /* High z-index to sit on top */
        }

        #joystick-zone {
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto; 
            touch-action: none;
            position: relative;
        }

        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="portrait-warning">
        <h1>ROTATE DEVICE</h1>
        <p>Please use Landscape Mode to play.</p>
        <div style="font-size: 50px; transform: rotate(90deg);">📱</div>
    </div>

    <div id="game-container">
        <div id="touch-surface"></div>

        <div id="overlay">
            <h1 id="status-text">MAZE ESCAPE</h1>
            <p>Follow the <span style="color:yellow">lights</span> to the <span style="color:red">RED</span> pillar.</p>
            <p style="font-size: 0.8em; color: #ccc">Left thumb move. Right thumb look.</p>
            <button id="start-btn">START GAME</button>
        </div>

        <div id="ui-layer">
            <div id="top-bar">TIME: <span id="timer">75</span>s</div>
            <div id="look-hint">Drag right side to look around</div>
            <div id="joystick-zone-wrapper">
                <div id="joystick-zone">
                    <div id="joystick-knob"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const TILE_SIZE = 10;
        const WALL_HEIGHT = 12;
        const MOVEMENT_SPEED = 0.4;
        const TURN_SPEED_JOYSTICK = 0.03;
        const TURN_SPEED_TOUCH = 0.005;
        const MAZE_SIZE = 15; 
        const PLAYER_RADIUS = TILE_SIZE * 0.25; 

        // --- GLOBAL VARIABLES ---
        let camera, scene, renderer;
        let player = { x: TILE_SIZE*1.5, z: TILE_SIZE*1.5, rotation: 0 };
        let goalPos = {gridX: 0, gridZ: 0};
        let startPos = {gridX: 1, gridZ: 1};

        // Controls
        let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
        let lookControl = { active: false, lastX: 0 };

        // Game State
        let mazeMap = [];
        let hintObjects = []; 
        let gameActive = false;
        let timeLeft = 75;
        let timerInterval;
        let audioCtx, mainGainNode;
        
        // DOM Elements
        const knob = document.getElementById('joystick-knob');
        const zone = document.getElementById('joystick-zone');
        const touchSurface = document.getElementById('touch-surface');
        const timerDisplay = document.getElementById('timer');
        const overlay = document.getElementById('overlay');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        // --- MAIN INIT ---
        init3D();
        generateMaze(); 
        setupControls();

        startBtn.addEventListener('click', startGame);

        function startGame() {
            try {
                // 1. Reset State
                timeLeft = 75;
                gameActive = true;
                timerDisplay.innerText = timeLeft;
                overlay.style.display = 'none';
                
                // 2. Reset Player Position
                player.x = (startPos.gridX + 0.5) * TILE_SIZE;
                player.z = (startPos.gridZ + 0.5) * TILE_SIZE;
                player.rotation = 0;

                // 3. Regenerate Maze
                clearScene();
                generateMaze();
                generateHints();

                // 4. Audio (Safe Mode)
                try {
                    if(!audioCtx) initAudio();
                    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    if(mainGainNode) mainGainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                } catch(e) {
                    console.log("Audio disabled due to browser policy or error: ", e);
                }

                // 5. Start Timer
                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if(!gameActive) return;
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if(timeLeft <= 0) endGame(false);
                }, 1000);
            } catch (err) {
                alert("Game Error: " + err.message);
            }
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(timerInterval);
            overlay.style.display = 'flex';
            statusText.innerText = win ? "YOU ESCAPED!" : "TIME UP!";
            statusText.style.color = win ? "#0f0" : "#f00";
            startBtn.innerText = "PLAY AGAIN";
            
            if(mainGainNode && audioCtx) {
                 try { mainGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5); } catch(e){}
            }
        }

        // --- 3D SCENE SETUP ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 1, 35);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; 
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8, 40);
            pointLight.position.set(0, 2, 0);
            camera.add(pointLight);
            scene.add(camera);

            const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const ceilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

            const floorGeo = new THREE.PlaneGeometry(MAZE_SIZE*TILE_SIZE*2, MAZE_SIZE*TILE_SIZE*2);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            const ceiling = new THREE.Mesh(floorGeo, ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = WALL_HEIGHT;
            scene.add(ceiling);

            animate(); 
        }

        function clearScene() {
            for(let i = scene.children.length - 1; i >= 0; i--) {
                let obj = scene.children[i];
                if(obj.userData.isLevelObject) {
                    scene.remove(obj);
                }
            }
            hintObjects = [];
        }

        // --- MAZE & HINTS ---
        function generateMaze() {
            mazeMap = [];
            // 1 = Wall, 0 = Path, 2 = Goal
            for(let z=0; z<MAZE_SIZE; z++) {
                let row = [];
                for(let x=0; x<MAZE_SIZE; x++) {
                    if (x===0 || x===MAZE_SIZE-1 || z===0 || z===MAZE_SIZE-1) {
                        row.push(1);
                    } else {
                        row.push(Math.random() > 0.75 ? 1 : 0);
                    }
                }
                mazeMap.push(row);
            }

            mazeMap[startPos.gridZ][startPos.gridX] = 0;
            mazeMap[startPos.gridZ][startPos.gridX+1] = 0;
            mazeMap[startPos.gridZ+1][startPos.gridX] = 0;

            goalPos = {gridX: MAZE_SIZE-3, gridZ: MAZE_SIZE-3};
            mazeMap[goalPos.gridZ][goalPos.gridX] = 2;
            mazeMap[goalPos.gridZ-1][goalPos.gridX] = 0;
            mazeMap[goalPos.gridZ][goalPos.gridX-1] = 0;

            const wallGeo = new THREE.BoxGeometry(TILE_SIZE, WALL_HEIGHT, TILE_SIZE);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.9 });
            const goalGeo = new THREE.CylinderGeometry(TILE_SIZE/3, TILE_SIZE/3, WALL_HEIGHT, 16);
            const goalMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });

            for(let z=0; z<MAZE_SIZE; z++) {
                for(let x=0; x<MAZE_SIZE; x++) {
                    if(mazeMap[z][x] === 1) {
                        const mesh = new THREE.Mesh(wallGeo, wallMat);
                        mesh.position.set((x+0.5) * TILE_SIZE, WALL_HEIGHT/2, (z+0.5) * TILE_SIZE);
                        mesh.castShadow = true;
                        mesh.userData.isLevelObject = true;
                        scene.add(mesh);
                    } else if (mazeMap[z][x] === 2) {
                        const mesh = new THREE.Mesh(goalGeo, goalMat);
                        mesh.position.set((x+0.5) * TILE_SIZE, WALL_HEIGHT/2, (z+0.5) * TILE_SIZE);
                        const goalLight = new THREE.PointLight(0xff0000, 2, TILE_SIZE*3);
                        goalLight.position.y = 2;
                        mesh.add(goalLight);
                        mesh.userData.isLevelObject = true;
                        scene.add(mesh);
                    }
                }
            }
        }

        function findPath(start, end) {
            let queue = [start];
            let visited = new Set();
            visited.add(`${start.gridX},${start.gridZ}`);
            let cameFrom = {};

            let headIndex = 0;
            while(headIndex < queue.length) {
                let current = queue[headIndex++];
                if(current.gridX === end.gridX && current.gridZ === end.gridZ) {
                    let path = [];
                    let temp = current;
                    while(temp) {
                        path.unshift(temp);
                        temp = cameFrom[`${temp.gridX},${temp.gridZ}`];
                    }
                    return path;
                }
                const neighbors = [
                    {gridX: current.gridX+1, gridZ: current.gridZ}, {gridX: current.gridX-1, gridZ: current.gridZ},
                    {gridX: current.gridX, gridZ: current.gridZ+1}, {gridX: current.gridX, gridZ: current.gridZ-1}
                ];
                for(let neighbor of neighbors) {
                    let key = `${neighbor.gridX},${neighbor.gridZ}`;
                    if(neighbor.gridX >= 0 && neighbor.gridX < MAZE_SIZE &&
                       neighbor.gridZ >= 0 && neighbor.gridZ < MAZE_SIZE &&
                       mazeMap[neighbor.gridZ][neighbor.gridX] !== 1 &&
                       !visited.has(key)) {
                        visited.add(key);
                        cameFrom[key] = current;
                        queue.push(neighbor);
                    }
                }
            }
            return null;
        }

        function generateHints() {
            const path = findPath(startPos, goalPos);
            if(!path) return;
            const hintGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const hintMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            for(let i = 2; i < path.length - 1; i += 2) {
                const node = path[i];
                const hintMesh = new THREE.Mesh(hintGeo, hintMat);
                hintMesh.position.set((node.gridX+0.5)*TILE_SIZE, 2, (node.gridZ+0.5)*TILE_SIZE);
                const hintLight = new THREE.PointLight(0xffff00, 0.5, TILE_SIZE * 1.5);
                hintMesh.add(hintLight);
                hintMesh.userData.isLevelObject = true;
                scene.add(hintMesh);
                hintObjects.push(hintMesh);
            }
        }

        // --- ANIMATION & PHYSICS ---
        function animate() {
            requestAnimationFrame(animate);

            if(gameActive) {
                updateMovement();
                const time = Date.now() * 0.003;
                hintObjects.forEach((h, index) => {
                    h.position.y = 2 + Math.sin(time + index) * 0.5;
                });
            }

            camera.position.set(player.x, WALL_HEIGHT * 0.4, player.z);
            camera.rotation.set(0, player.rotation, 0); 
            renderer.render(scene, camera);
        }

        function updateMovement() {
            if (joystick.active) {
                const turnSpeed = -(joystick.dx / 75) * TURN_SPEED_JOYSTICK;
                player.rotation += turnSpeed;
                
                const moveSpeed = -(joystick.dy / 75) * MOVEMENT_SPEED;
                const deltaX = -Math.sin(player.rotation) * moveSpeed;
                const deltaZ = -Math.cos(player.rotation) * moveSpeed;

                tryMove(deltaX, 0);
                tryMove(0, deltaZ);
            }
            const currentGridX = Math.floor(player.x / TILE_SIZE);
            const currentGridZ = Math.floor(player.z / TILE_SIZE);
            if(mazeMap[currentGridZ][currentGridX] === 2) {
                endGame(true);
            }
        }

        function tryMove(dx, dz) {
            const nextX = player.x + dx;
            const nextZ = player.z + dz;
            const minGridX = Math.floor((nextX - PLAYER_RADIUS) / TILE_SIZE);
            const maxGridX = Math.floor((nextX + PLAYER_RADIUS) / TILE_SIZE);
            const minGridZ = Math.floor((nextZ - PLAYER_RADIUS) / TILE_SIZE);
            const maxGridZ = Math.floor((nextZ + PLAYER_RADIUS) / TILE_SIZE);

            for(let gz = minGridZ; gz <= maxGridZ; gz++) {
                for(let gx = minGridX; gx <= maxGridX; gx++) {
                    if(gz < 0 || gz >= MAZE_SIZE || gx < 0 || gx >= MAZE_SIZE || mazeMap[gz][gx] === 1) {
                        const closestX = Math.max(gx * TILE_SIZE, Math.min(nextX, (gx+1) * TILE_SIZE));
                        const closestZ = Math.max(gz * TILE_SIZE, Math.min(nextZ, (gz+1) * TILE_SIZE));
                        const distSq = (nextX - closestX)**2 + (nextZ - closestZ)**2;
                        if (distSq < PLAYER_RADIUS**2) return; 
                    }
                }
            }
            player.x = nextX;
            player.z = nextZ;
        }

        // --- CONTROLS ---
        function setupControls() {
            const handleJoyStart = (e) => { // FIXED SYNTAX HERE
                e.stopPropagation(); 
                const touch = e.targetTouches ? e.targetTouches[0] : e;
                joystick.active = true;
                joystick.originX = touch.clientX;
                joystick.originY = touch.clientY;
                knob.style.transition = 'none';
            };

            const handleJoyMove = (e) => {
                if (!joystick.active) return;
                e.preventDefault(); 
                const touch = e.targetTouches ? e.targetTouches[0] : e;
                let dx = touch.clientX - joystick.originX;
                let dy = touch.clientY - joystick.originY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = 70;
                if(dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joystick.dx = dx;
                joystick.dy = dy;
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            };

            const handleJoyEnd = (e) => {
                if(e && e.stopPropagation) e.stopPropagation();
                joystick.active = false;
                joystick.dx = 0; joystick.dy = 0;
                knob.style.transition = '0.2s';
                knob.style.transform = `translate(-50%, -50%)`;
            };

            zone.addEventListener('touchstart', handleJoyStart, {passive: false});
            zone.addEventListener('touchmove', handleJoyMove, {passive: false});
            zone.addEventListener('touchend', handleJoyEnd);
            zone.addEventListener('touchcancel', handleJoyEnd);

            // Desktop Mouse Joystick
            zone.addEventListener('mousedown', (e) => { handleJoyStart(e); });
            window.addEventListener('mousemove', (e) => { if(joystick.active) handleJoyMove(e); });
            window.addEventListener('mouseup', handleJoyEnd);

            // Look Controls
            touchSurface.addEventListener('touchstart', (e) => {
                if(e.targetTouches.length === 1) {
                    lookControl.active = true;
                    lookControl.lastX = e.targetTouches[0].clientX;
                }
            }, {passive:false});

            touchSurface.addEventListener('touchmove', (e) => {
                if(lookControl.active && e.targetTouches.length > 0) {
                     e.preventDefault();
                    const clientX = e.targetTouches[0].clientX;
                    const deltaX = clientX - lookControl.lastX;
                    player.rotation -= deltaX * TURN_SPEED_TOUCH;
                    lookControl.lastX = clientX;
                }
            }, {passive:false});

             const endLook = () => { lookControl.active = false; };
             touchSurface.addEventListener('touchend', endLook);
             touchSurface.addEventListener('touchcancel', endLook);
             
             // Mouse Look
             touchSurface.addEventListener('mousedown', (e) => { lookControl.active=true; lookControl.lastX=e.clientX; });
             touchSurface.addEventListener('mousemove', (e) => {
                 if(lookControl.active) {
                     const deltaX = e.clientX - lookControl.lastX;
                     player.rotation -= deltaX * TURN_SPEED_TOUCH;
                     lookControl.lastX = e.clientX;
                 }
             });
             window.addEventListener('mouseup', () => lookControl.active = false);
        }

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            mainGainNode = audioCtx.createGain();
            mainGainNode.gain.value = 0; 
            mainGainNode.connect(audioCtx.destination);
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sine'; osc1.frequency.value = 55;
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle'; osc2.frequency.value = 58;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 200;
            osc1.connect(filter); osc2.connect(filter);
            filter.connect(mainGainNode);
            osc1.start(); osc2.start();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
